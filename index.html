<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Threebric human-in-the-loop learning platform." />
    <title>Threebric</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #07111f;
        color: #f4f7fb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #17335c, #07111f 60%);
      }

      main {
        width: min(680px, calc(100% - 48px));
        padding: 48px;
        border: 1px solid #31527c;
        border-radius: 24px;
        background: rgba(8, 20, 36, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .status {
        color: #7ee7b7;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
      }

      p {
        color: #bdcce0;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      ul {
        display: grid;
        gap: 12px;
        padding-left: 20px;
        color: #dbe8f8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Development proof online</div>
      <h1>Threebric</h1>
      <p>
        One evidence-driven profile supporting three focused workspaces with
        human approval for important AI decisions.
      </p>
      <ul>
        <li>GATE ECE</li>
        <li>Quantum Research</li>
        <li>AI Engineering</li>
      </ul>
    </main>
  </body>
</html>
